name: Wrapper bug
description: Report a reproducible wrapper problem using synthetic information.
body:
  - type: markdown
    attributes:
      value: Do not attach vendor installers, credentials, tenant addresses, raw logs or agent state. Use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Wrapper commit or image digest
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: OS, architecture, Docker and Compose versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction, expected result and actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and scope
      options:
        - label: I removed customer information, secrets and proprietary software.
          required: true
        - label: I understand this project has not validated real host monitoring.
          required: true
